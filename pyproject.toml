[project]
name = "halloween-party-cam"
version = "0.1.0"
description = "Turns everyone on the dance floor into dancing skeletons for a live Halloween party feed."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
    "ultralytics>=8.3.0",
    "opencv-python>=4.9",
    "numpy>=1.26",
    "torch>=2.3",
    "torchvision>=0.18",
    "pillow>=10.0",
    "python-dotenv>=1.0",
    "lap>=0.5.12",
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
]

[project.scripts]
party-cam = "partycam.app:main"
party-cam-record = "partycam.record:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["partycam"]
